[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcrawl"
version = "0.1.0"
description = "A small Scrapy-inspired crawler runtime with native purser lease scheduling."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "parsel>=1.9",
    "redis>=5",
]

[project.optional-dependencies]
# purser is developed next to this project; install it editable:
#   pip install -e ../purser
resources = ["purser>=0.2"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "fakeredis>=2",
]
docs = ["mkdocs-material>=9.5"]

[project.scripts]
pcrawl = "pcrawl.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pcrawl*"]

[tool.setuptools.package-data]
pcrawl = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [".", "../purser"]

[tool.ruff]
line-length = 100
target-version = "py310"
